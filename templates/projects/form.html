{% extends "base.html" %}
{% block title %}{{ heading }} — SözCheck{% endblock %}
{% block content %}<section class="auth-wrap project-form-wrap"><div class="eyebrow">PROJECT SETUP</div><h1>{{ heading }}</h1><p>Add the context reviewers need to understand your game.</p><form method="post" class="auth-form">{% csrf_token %}{{ form.as_p }}<div class="form-actions"><button class="button" type="submit">Save project <span>→</span></button><a class="text-link" href="{% if project %}{% url 'project_detail' project.pk %}{% else %}{% url 'dashboard' %}{% endif %}">Cancel</a></div></form></section>{% endblock %}
